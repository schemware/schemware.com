<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schemware, LLC</title>
  <meta name="description" content="Schemware, LLC makes Sheepshead, the five-handed card game, for iPhone, iPad and the web.">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f5ef;
      --text: #1c2420;
      --muted: #4d5a53;
      --accent: #1f5c3f;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121815; --text: #eef1ec; --muted: #b3bdb6; --accent: #d9b45a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--text);
      font: 1.0625rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main { max-width: 34rem; }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; line-height: 1.2; }
    p { margin: 0 0 1rem; }
    a { color: var(--accent); }
    footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Schemware, LLC</h1>
    <p>Schemware makes <strong>Sheepshead</strong>, the five-handed card game, to play online with friends and bots on iPhone, iPad and the web.</p>
    <p>Contact: <a href="mailto:hello@schemware.com">hello@schemware.com</a></p>
    <footer>© 2026 Schemware, LLC</footer>
  </main>
</body>
</html>
